<style>
  :root { --pad: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; }
  body { line-height: 1.6; overflow: hidden; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 6px; }

  /*
   * Art direction.
   *
   * The title is painted into the artwork, so it must never be cropped.
   * Measured against the real file: object-fit:cover cuts it on anything
   * narrower than 16:9, a laptop included. So the image is sized by WIDTH and
   * pinned to the top, and the page carries on below it in the artwork's own
   * bottom colour. On ultrawide the overflow falls off the bottom, where there
   * is only floor.
   */
  .art {
    position: fixed; inset: 0;
    background-color: #af7b50;
    background-repeat: no-repeat;
    background-position: top center;
    background-size: 100% auto;
  }

  /*
   * Two paintings, one scene.
   *
   * The landscape file is 16:9 and the portrait file is 0.463, which is within
   * a hair of a modern phone (an iPhone 14 is 0.462). So a phone gets its own
   * cover-cropped artwork rather than a letterboxed band with filler under it,
   * and the composition holds in both shapes.
   *
   * image-set picks AVIF where the browser takes it and the right density for
   * the screen; the media queries pick the viewport size.
   */
  .art { background-image: image-set(
    url('img/hero-800.avif') type('image/avif'),
    url('img/hero-800.webp') type('image/webp')); }

  @media (min-width: 421px) {
    .art { background-image: image-set(
      url('img/hero-1200.avif') type('image/avif'),
      url('img/hero-1200.webp') type('image/webp')); }
  }
  @media (min-width: 701px) {
    .art { background-image: image-set(
      url('img/hero-1672.avif') type('image/avif'),
      url('img/hero-1672.webp') type('image/webp')); }
  }

  /* Portrait: the tall painting, full bleed. Anchored to the top because a
     wider portrait, a tablet, crops from the bottom, and the title lives at
     the top. The floor is what we can afford to lose. */
  @media (max-aspect-ratio: 1/1) {
    .art {
      background-size: cover;
      background-position: center top;
      background-image: image-set(
        url('img/hero-p-540.avif') type('image/avif') 1x,
        url('img/hero-p-1080.avif') type('image/avif') 2x,
        url('img/hero-p-540.webp') type('image/webp') 1x,
        url('img/hero-p-1080.webp') type('image/webp') 2x);
    }
  }
  @media (max-aspect-ratio: 1/1) and (min-width: 601px) {
    .art { background-image: image-set(
      url('img/hero-p-800.avif') type('image/avif') 1x,
      url('img/hero-p-1080.avif') type('image/avif') 2x,
      url('img/hero-p-800.webp') type('image/webp') 1x,
      url('img/hero-p-1080.webp') type('image/webp') 2x); }
  }

  /* Safari shipped image-set behind a prefix for years; without this it gets
     no artwork at all, and the artwork is the whole design. */
  @supports not (background-image: image-set(url('x.webp') type('image/webp'))) {
    .art { background-image: url('img/hero-1672.webp'); }
    @media (max-aspect-ratio: 1/1) {
      .art { background-image: url('img/hero-p-800.webp'); }
    }
  }

  /* Darkens the floor so the glass panels have something solid to sit against,
     in both orientations. */
  .art::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      transparent 0%, transparent 58%,
      rgba(109,69,42,.34) 78%, rgba(61,37,23,.82) 100%);
  }

  .glass {
    background: rgba(38, 23, 14, .74);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid rgba(255, 233, 209, .16);
  }

  /* ============================================================
     Progress bar
     ============================================================
     Built like Android's: an inactive track, an active track that fills
     behind what has played, a thumb, and Material's stop indicator at the
     far end. A bare range input cannot show the played portion, which is why
     the input is still here, stretched over the top and invisible, doing the
     keyboard, pointer and screen-reader work while these four elements do the
     drawing.

     The fill advances by scaleX and the thumb by translateX, both transitioned
     linear over the same 500ms as the position poll. That is what turns a
     twice-a-second update into continuous travel instead of a visible step
     every half second. Percentage translateX resolves against the element's
     own width, which is the full track, so the thumb needs no measuring. */
  .progress { position: relative; display: flex; height: 26px; flex: 1 1 auto; align-items: center; }

  .progress-track, .progress-fill {
    position: absolute; left: 0; right: 0;
    height: 4px; border-radius: 999px;
  }
  .progress-track { background: rgba(255, 233, 209, .25); }
  .progress-fill {
    background: #FF9933;
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform 500ms linear;
  }

  /* Material's stop indicator: the dot that marks the end of the track. */
  .progress-stop {
    position: absolute; right: 0;
    width: 4px; height: 4px; border-radius: 999px;
    background: rgba(255, 233, 209, .55);
  }

  /* Full width, so translateX in percent walks the thumb along the track. */
  .progress-head {
    position: absolute; left: 0; top: 50%;
    width: 100%; height: 0;
    transform: translateX(0);
    transition: transform 500ms linear;
  }
  .progress-thumb {
    position: absolute; left: 0; top: 0;
    width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border-radius: 999px; background: #FF9933; border: 2px solid #2a1a10;
  }

  /* While dragging or seeking the bar must land instantly; a half second of
     catching up would fight the finger. */
  .progress.is-scrubbing .progress-fill,
  .progress.is-scrubbing .progress-head { transition: none; }

  /* The input carries the interaction and none of the appearance. */
  .progress-input {
    position: absolute; inset: 0; z-index: 2;
    width: 100%; height: 100%; margin: 0;
    opacity: 0; cursor: pointer;
    -webkit-appearance: none; appearance: none; background: transparent;
  }
  .progress-input::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; }
  .progress-input::-moz-range-thumb { width: 22px; height: 22px; border: 0; opacity: 0; }

  /* The input is invisible, so its focus ring has to be drawn by the track. */
  .progress-input:focus-visible ~ .progress-track {
    outline: 2px solid #fff;
    outline-offset: 5px;
    border-radius: 999px;
  }

  /* A progress indicator's travel is the information, not decoration, so it
     keeps moving under reduced motion. Stepping twice a second would read as
     a fault rather than as calm. */

  /* ============================================================
     Transitions, taken from transitions.dev
     ============================================================
     Three of theirs, then audited against emilkowalski/skills
     (review-animations) and ibelick/ui-skills (fixing-motion-performance).
     Four things changed as a result, each noted where it applies. Their
     prefers-reduced-motion rules are kept as they ship. */

  :root {
    /* Emil's table puts drawers at 200-500ms but the general rule at under
       300ms. 400 read sluggish on a sheet this size; 300/250 is still a
       drawer and answers the tap noticeably faster. */
    --panel-open-dur: 300ms;
    --panel-close-dur: 250ms;
    --panel-translate-y: 40px;
    --panel-blur: 2px;
    --panel-ease: cubic-bezier(0.22, 1, 0.36, 1);

    --text-swap-dur: 150ms;
    --text-swap-translate-y: 4px;
    --text-swap-blur: 2px;
    --text-swap-ease: ease-in-out;

    --toast-open: 350ms;
    --toast-close: 250ms;
    --toast-distance: 16px;
    --toast-blur: 2px;
    --toast-scale: 0.97;
    --toast-ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Panel reveal: the songs and playlists sheet.
     The cross-blur is dropped here. "Never animate blur on large surfaces",
     and this panel is up to 84vh tall and already carries a backdrop-filter,
     so animating filter on top of it re-rasterises the blurred backdrop every
     frame. Translate and opacity carry the same read. */
  .t-panel-slide {
    transform: translateY(var(--panel-translate-y));
    opacity: 0;
    pointer-events: none;
    transition:
      transform var(--panel-close-dur) var(--panel-ease),
      opacity   var(--panel-close-dur) var(--panel-ease);
  }
  .t-panel-slide[data-open="true"] {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
    transition:
      transform var(--panel-open-dur) var(--panel-ease),
      opacity   var(--panel-open-dur) var(--panel-ease);
  }

  /* Text states swap: the credit line under the track title, which has to
     change between five different messages without simply blinking. */
  .t-text-swap {
    display: inline-block;
    transform: translateY(0);
    filter: blur(0);
    opacity: 1;
    transition:
      transform var(--text-swap-dur) var(--text-swap-ease),
      filter    var(--text-swap-dur) var(--text-swap-ease),
      opacity   var(--text-swap-dur) var(--text-swap-ease);
    /* Blur kept here and only here: a few words, no backdrop-filter beneath
       them, and a 150ms one-shot. That is the case the guidance allows. */
  }
  .t-text-swap.is-exit {
    transform: translateY(calc(var(--text-swap-translate-y) * -1));
    filter: blur(var(--text-swap-blur));
    opacity: 0;
  }
  .t-text-swap.is-enter-start {
    transform: translateY(var(--text-swap-translate-y));
    filter: blur(var(--text-swap-blur));
    opacity: 0;
    transition: none;
  }

  /* Toast open/close: the floating cards and the player. */
  /* Toast open/close: the floating cards and the player.
     Blur dropped for the same reason as the panel, and will-change with it:
     these two are on screen for the whole session, so a permanent hint would
     hold promoted layers alive forever for a transition that runs once.
     Browsers promote on their own when a transform transition starts. */
  .t-toast {
    opacity: 0;
    transform: translateY(var(--toast-distance)) scale(var(--toast-scale));
    transition:
      opacity var(--toast-close) var(--toast-ease),
      transform var(--toast-close) var(--toast-ease);
  }
  .t-toast.is-open {
    opacity: 1;
    transform: translateY(0) scale(1);
    transition:
      opacity var(--toast-open) var(--toast-ease),
      transform var(--toast-open) var(--toast-ease);
  }

  @media (prefers-reduced-motion: reduce) {
    .t-panel-slide, .t-text-swap, .t-toast { transition: none !important; }
  }

  /* shadcn's look without shadcn: it is a React library and this page has no
     React. What carries over is the visual grammar its components share, a
     ring on focus rather than a bare outline, and a pressed state that dips
     the control slightly. */
  /* Press feedback on anything pressable, which is what the guidance asks for,
     rather than only the play button. 0.97 and 140ms sit inside the
     recommended 0.95-0.98 and 100-160ms. */
  .btn-press,
  #topnav button,
  #sheet-body button,
  #sheet-close,
  #p-prev, #p-next, #p-close,
  [data-close-card] {
    transition: transform 140ms var(--panel-ease), background-color 140ms var(--panel-ease), color 140ms var(--panel-ease);
  }
  .btn-press:active,
  #topnav button:active,
  #sheet-body button:active,
  #sheet-close:active,
  #p-prev:active, #p-next:active, #p-close:active,
  [data-close-card]:active {
    transform: scale(0.97);
  }
  @media (prefers-reduced-motion: reduce) {
    .btn-press, #topnav button, #sheet-body button, #sheet-close,
    #p-prev, #p-next, #p-close, [data-close-card] { transition: none !important; }
  }
  .ring-focus:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px rgba(38,23,14,.9), 0 0 0 4px rgba(255,255,255,.85);
  }

  .no-scrollbar::-webkit-scrollbar { width: 6px; }
  .no-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,233,209,.25); border-radius: 999px; }
</style>
</head>

    <button data-close-card="card-whatsapp" aria-label="बंद कर" class="grid h-8 w-8 shrink-0 place-items-center rounded-full text-white/60 hover:text-white">

<script>
/* ============================================================
   Data: 27 uploads, each one checked in a live player.
   ============================================================ */
const CATS = { abhang:'अभंग', kirtan:'कीर्तन', bhajan:'भजन',
               panchpadi:'पंचपदी', stotra:'स्तोत्र', maifil:'मैफल' };

/* Filled from songs.json at boot. A GitHub Action rewrites that file daily
   from the YouTube playlists, so a song added there reaches the site without
   anyone touching this page. */
let SONGS = [];

const LISTS = [
  { name:'रूप पाहता लोचनी, आठ चाली', desc:'एकच अभंग, आठ गळे',
    match: s => s.t === 'रूप पाहता लोचनी' },
  { name:'सुंदर ते ध्यान, चार चाली', desc:'तुकारामांचा सर्वांत परिचित अभंग',
    match: s => s.t.indexOf('सुंदर ते ध्यान') === 0 },
  { name:'वसंतगडकरांची सेवा', desc:'कीर्तनं आणि अभंग',
    match: s => (s.by || '').indexOf('वसंतगडकर') >= 0 },
  { name:'पहाटेचा नामघोष', desc:'दिवस सुरू करायला',
    match: s => s.cat === 'bhajan' || s.cat === 'panchpadi' },
  { name:'देवीची स्तोत्रं', desc:'नवरात्रासाठी, आणि एरवीही',
    match: s => s.cat === 'stotra' },
];

/* ============================================================
   Icons
   ============================================================
   Lucide's play and pause as stroke geometry. morphicons animates between
   the two `d` strings with spring physics, which is why the button holds a
   single path rather than two SVGs swapped by a class. */
const ICON = {
  play:  'M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z',
  pause: 'M15 3h3a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM6 3h3a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z',
};

/* The morph driver, loaded lazily as an ES module. If the CDN is unreachable
   the button still works: `morph` stays null and the fallback below writes the
   path straight to the element, so the icon changes without animating. */
let morph = null;

import('https://cdn.jsdelivr.net/npm/morphicons@1.7.1/dist/dom.js')
  .then(function (m) {
    const el = document.getElementById('ic-toggle');
    if (!el) return;
    morph = m.createMorph(el, ICON.play, { reducedMotion: 'user' });
  })
  .catch(function () { /* no morphing; setIcon falls back to a plain write */ });

function setIcon(d, animate) {
  const el = document.getElementById('ic-toggle');
  if (!el) return;
  if (!morph) { el.setAttribute('d', d); return; }
  if (animate) morph.morphTo(d, 'snappy');
  else morph.set(d);
}

/* ============================================================
   Helpers
   ============================================================ */
const $ = (id) => document.getElementById(id);
const fmt = (s) => (!isFinite(s) || s < 0) ? '0:00'
  : Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
const credit = (s) => [s.by, s.raga ? 'राग ' + s.raga : s.poet, CATS[s.cat]]
  .filter(Boolean).join(' · ');
const isLong = (s) => s.sec >= 1200;

function tickClock() {
  $('clock').textContent = new Date()
    .toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit', hour12:true })
    .toUpperCase();
}
tickClock();
setInterval(tickClock, 20000);

/* Moves the fill and the thumb together.
 *
 * scaleX on the fill, translateX in percent on the head. Both are compositor
 * properties, and the percentage means the thumb never needs the track
 * measured. `instant` skips the 500ms interpolation for a seek or a track
 * change, where catching up smoothly would look like lag. */
function paintProgress(pos, dur, instant) {
  const pct = (dur > 0) ? Math.max(0, Math.min(1, pos / dur)) : 0;
  const bar = $('p-progress');
  if (!bar) return;
  if (instant) bar.classList.add('is-scrubbing');
  $('p-fill').style.transform = 'scaleX(' + pct.toFixed(4) + ')';
  $('p-head').style.transform = 'translateX(' + (pct * 100).toFixed(3) + '%)';
  if (instant) {
    void bar.offsetWidth;                 // commit before the transition returns
    bar.classList.remove('is-scrubbing');
  }
}

/* ============================================================
   Player, on YouTube's IFrame API
   ============================================================
   The site stores no audio. Each track points at an upload its channel
   published, played behind our own controls. The API script is fetched only
   when someone actually presses play.
   ------------------------------------------------------------ */
let yt = null, apiPromise = null;
let queue = [], at = -1, playing = false, poll = null, saver = null;

/* Where the listener had got to, so a refresh does not send them back to the
   start of a forty minute kirtan. Held as {id, pos, q, t}: the track, the
   seconds into it, the queue it was playing from, and when it was written.
   Everything is wrapped because localStorage throws outright in a private
   window or with site data blocked, and a site that cannot remember is fine
   while a site that crashes is not. */
const SAVE_KEY = 'bhajan-mandal:last';

/* A track picked up again tomorrow is welcome; one from last month is just
   confusing, so the note is dropped after a fortnight. */
const SAVE_TTL = 14 * 24 * 60 * 60 * 1000;

function saveState() {
  if (at < 0 || !queue[at]) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      id: queue[at].id,
      pos: Math.floor(lastPos),
      q: queue.map(function (s) { return s.id; }),
      t: Date.now(),
    }));
  } catch (e) { /* storage unavailable; playback still works */ }
}

function loadState() {
  let raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return null; }
  if (!raw) return null;

  let v;
  try { v = JSON.parse(raw); } catch (e) { return null; }
  if (!v || !v.id || Date.now() - (v.t || 0) > SAVE_TTL) return null;

  const byId = function (id) {
    return SONGS.filter(function (s) { return s.id === id; })[0];
  };
  const song = byId(v.id);
  if (!song) return null;

  const list = (v.q || []).map(byId).filter(Boolean);

  /* Within half a minute of the end it is finished, not paused. Resuming there
     would play a few seconds of silence and jump on. */
  const pos = (v.pos > 0 && v.pos < song.sec - 30) ? v.pos : 0;
  return { song: song, list: list.length ? list : SONGS, pos: pos };
}

/* The last position the player reported. Kept separately because getCurrentTime
   is gone the moment the iframe is torn down, and that is exactly when the page
   is unloading and the position most needs writing. */
let lastPos = 0;

/* Set when a saved position is waiting to be resumed but nothing has been
   pressed yet, since a browser will not start audio without a gesture. */
let pending = null;

function loadApi() {
  if (apiPromise) return apiPromise;
  apiPromise = new Promise(function (resolve, reject) {
    if (window.YT && window.YT.Player) return resolve();
    window.onYouTubeIframeAPIReady = resolve;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.async = true;
    s.onerror = function () { reject(new Error('IFrame API did not load')); };
    document.head.appendChild(s);
    setTimeout(function () { reject(new Error('IFrame API timed out')); }, 12000);
  });
  apiPromise.catch(function () { apiPromise = null; });
  return apiPromise;
}

/* The line under the title has four different things to say and they must not
   fight each other, so one function owns it.
     credit      the singer, raga and category
     resume      a saved position waiting to be picked up
     interrupted playback stopped because the app went to the background
     failed      this upload will not play
     offline     YouTube could not be reached */
let subMode = 'credit';

function subText() {
  const song = queue[at] || (pending && pending.song);
  if (!song) return '';
  if (subMode === 'failed') return 'हे सध्या वाजवता येत नाही';
  if (subMode === 'offline') return 'YouTube ला जोडता आलं नाही';
  if (subMode === 'interrupted') return 'थांबलं होतं · ' + fmt(lastPos) + ' पासून पुढे';
  if (subMode === 'resume') return credit(song) + ' · ' + fmt(lastPos) + ' पासून';
  return credit(song);
}

/* The three-phase swap transitions.dev describes: the old line leaves upward
   with a blur, the text is replaced while it sits below, then it rises back.
   Only run when the words actually change, or a clock tick would blur the line
   twice a second. */
function paintSub() {
  const el = $('p-sub');
  const next = subText();
  if (!next || el.textContent === next) return;

  el.classList.add('is-exit');
  setTimeout(function () {
    el.textContent = next;
    el.classList.remove('is-exit');
    el.classList.add('is-enter-start');
    void el.offsetWidth;            // reflow, so the class below animates
    el.classList.remove('is-enter-start');
  }, 150);
}

function play(song, list, startAt) {
  const from = Math.max(0, Math.floor(startAt || 0));
  pending = null;
  queue = (list && list.length) ? list : [song];
  at = queue.indexOf(song);
  lastPos = from;

  $('p-title').textContent = song.t;
  subMode = 'credit';
  paintSub();
  $('p-dur').textContent = fmt(song.sec);
  $('p-seek').max = song.sec;
  $('p-seek').value = from;
  $('p-now').textContent = fmt(from);
  paintProgress(from, song.sec, true);
  render();
  saveState();

  loadApi().then(function () {
    if (yt) { yt.loadVideoById({ videoId: song.id, startSeconds: from }); return; }
    yt = new YT.Player('yt-host', {
      videoId: song.id,
      playerVars: { autoplay: 1, playsinline: 1, start: from },
      events: {
        onReady: function (e) { e.target.playVideo(); },
        onStateChange: function (e) {
          setPlaying(e.data === 1);
          if (e.data === 0) step(1);
        },
        /* A channel can pull or unlist an upload at any time. Say so rather
           than leaving a dead bar sitting there. */
        onError: function () {
          subMode = 'failed';
          paintSub();
          setPlaying(false);
        },
      },
    });
  }).catch(function () {
    subMode = 'offline';
    paintSub();
    setPlaying(false);
  });
}

function setPlaying(on) {
  const changed = playing !== on;
  playing = on;
  setIcon(on ? ICON.pause : ICON.play, changed);
  if (on && (subMode === 'interrupted' || subMode === 'resume')) {
    subMode = 'credit';
    paintSub();
  }
  $('p-toggle').setAttribute('aria-label', on ? 'थांबव' : 'वाजव');
  clearInterval(poll);
  clearInterval(saver);
  if (on) {
    poll = setInterval(paint, 500);
    /* Five seconds, not every paint: this is a disk write, and losing at most
       five seconds of a kirtan is not worth writing twice a second. */
    saver = setInterval(saveState, 5000);
  } else {
    saveState();
  }
  render();
}

function paint() {
  if (!yt || !yt.getCurrentTime) return;
  const pos = yt.getCurrentTime();
  /* Duration is re-read every tick rather than once: after loadVideoById
     YouTube reports PLAYING before the new metadata lands, so a single read
     leaves the scrubber scaled to the previous track. */
  const dur = yt.getDuration();
  if (dur > 0) { $('p-seek').max = Math.floor(dur); $('p-dur').textContent = fmt(dur); }
  lastPos = pos;
  $('p-seek').value = Math.floor(pos);
  $('p-now').textContent = fmt(pos);
  /* Not instant: this is the twice-a-second tick, and letting it interpolate
     over the same 500ms is what makes the bar travel rather than step. */
  paintProgress(pos, dur || Number($('p-seek').max), false);
}

function step(by) {
  const to = at + by;
  if (to < 0 || to >= queue.length) { if (yt) yt.pauseVideo(); return; }
  play(queue[to], queue);
}

$('p-toggle').addEventListener('click', function () {
  /* First press after a reload: this is the gesture the browser was waiting
     for, so the saved position can finally be resumed. */
  if (!yt && pending) { play(pending.song, pending.list, pending.pos); return; }
  if (!yt) { play(SONGS[0], SONGS); return; }

  if (playing) { yt.pauseVideo(); return; }

  /* Coming back from the background, YouTube has often rewound the player to
     zero. Seek before playing, otherwise "3:20 पासून पुढे" would be a promise
     the button quietly breaks. */
  if (subMode === 'interrupted' && lastPos > 0 && yt.seekTo) {
    yt.seekTo(lastPos, true);
  }
  yt.playVideo();
});
$('p-next').addEventListener('click', function () { step(1); });
$('p-prev').addEventListener('click', function () { step(-1); });
$('p-seek').addEventListener('input', function (e) {
  const v = Number(e.target.value);
  lastPos = v;
  $('p-now').textContent = fmt(v);
  paintProgress(v, Number(e.target.max), true);
  if (yt && yt.seekTo) yt.seekTo(v, true);
  else if (pending) pending.pos = v;
  saveState();
});

/* Last chance to write. pagehide fires where unload is unreliable, and
   visibilitychange covers a phone being switched away from, which on iOS is
   often the only event that arrives before the tab is frozen. */
window.addEventListener('pagehide', saveState);

/* Backgrounding.
 *
 * YouTube stops an embedded player the moment its tab leaves the foreground,
 * and its developer policies rule out playing from a background player, so
 * this is the platform working as intended rather than a fault here. What we
 * can do is not leave a silently dead bar behind: note that it was playing,
 * and on the way back say so along with the second it stopped at.
 *
 * The check is delayed a moment because a tab returning to the foreground
 * sometimes reports paused for an instant before resuming on its own, and
 * announcing an interruption that did not happen would be worse than saying
 * nothing. */
let wasPlayingWhenHidden = false;

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') {
    wasPlayingWhenHidden = playing;
    saveState();
    return;
  }
  if (!wasPlayingWhenHidden) return;
  setTimeout(function () {
    if (!playing && queue[at]) {
      subMode = 'interrupted';
      paintSub();
    }
    wasPlayingWhenHidden = false;
  }, 700);
});

/* Restore the last position.
 *
 * The bar is filled in but nothing plays: browsers refuse audio without a
 * gesture, and a page that starts blaring on open would deserve it. Pressing
 * play picks up from the saved second. Runs after the songs load, since it has
 * to find the saved track among them. */
function restore() {
  const saved = loadState();
  if (!saved) return;

  pending = saved;
  queue = saved.list;
  at = queue.indexOf(saved.song);
  lastPos = saved.pos;

  $('p-title').textContent = saved.song.t;
  $('p-sub').textContent = saved.pos > 0
    ? credit(saved.song) + ' · ' + fmt(saved.pos) + ' पासून'
    : credit(saved.song);
  $('p-dur').textContent = fmt(saved.song.sec);
  $('p-seek').max = saved.song.sec;
  $('p-seek').value = saved.pos;
  paintProgress(saved.pos, saved.song.sec, true);
  $('p-now').textContent = fmt(saved.pos);
}

/* One frame from now, whatever "now" is.
 *
 * requestAnimationFrame does not run at all while a document is hidden, and a
 * page opened in a background tab is hidden from the start. Anything that
 * waited only on a frame would sit in its closed state indefinitely, so the
 * timer is the floor: whichever arrives first wins, and the callback runs once. */
function nextFrame(fn) {
  let done = false;
  const once = function () { if (!done) { done = true; fn(); } };
  requestAnimationFrame(function () { requestAnimationFrame(once); });
  setTimeout(once, 60);
}

/* ============================================================
   Sheet
   ============================================================ */
let mode = 'songs', query = '', lastFocus = null;

function rows(list) {
  if (!list.length) return '<p class="p-8 text-center text-sm text-white/70">काहीच सापडलं नाही.</p>';
  return list.map(function (s) {
    const on = at >= 0 && queue[at] === s;
    const icon = (on && playing)
      ? '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + ICON.pause + '"/></svg>'
      : '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + ICON.play + '"/></svg>';
    return '<button data-song="' + SONGS.indexOf(s) + '"' +
      ' class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left transition hover:bg-white/10 ' + (on ? 'bg-white/10' : '') + '">' +
      '<span class="grid h-9 w-9 shrink-0 place-items-center rounded-full ' + (on ? 'bg-saffron text-[#2a1a10]' : 'bg-white/15 text-white') + '">' + icon + '</span>' +
      '<span class="min-w-0 flex-1">' +
        '<span class="block truncate text-sm">' + s.t + (isLong(s) ? ' <span class="text-[10px] text-white/70">पूर्ण सत्र</span>' : '') + '</span>' +
        '<span class="block truncate text-xs text-white/70">' + credit(s) + '</span>' +
      '</span>' +
      '<span class="shrink-0 text-xs tabular-nums text-white/70">' + fmt(s.sec) + '</span>' +
    '</button>';
  }).join('');
}

function render() {
  if ($('sheet').hidden) return;
  const q = query.trim().toLowerCase();
  /* Search the same words the row actually shows. The credit line renders a
     raga as "राग पहाडी", so searching "राग" has to match; matching only the
     bare raga name meant the one word on screen found nothing. */
  const hit = function (s) {
    if (!q) return true;
    const hay = [s.t, s.by, s.poet, s.raga, s.raga ? 'राग ' + s.raga : '',
                 CATS[s.cat]].filter(Boolean).join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  };

  if (mode === 'songs') {
    $('sheet-title').textContent = 'गाणी';
    $('sheet-body').innerHTML = rows(SONGS.filter(hit));
  } else {
    $('sheet-title').textContent = 'याद्या';
    const html = LISTS.map(function (L) {
      const items = SONGS.filter(L.match).filter(hit);
      if (!items.length) return '';
      const mins = Math.round(items.reduce(function (a, s) { return a + s.sec; }, 0) / 60);
      return '<section class="mb-5">' +
        '<div class="flex items-baseline gap-2 px-3 pb-0.5">' +
          '<h3 class="text-sm font-semibold">' + L.name + '</h3>' +
          '<span class="text-xs text-white/70">' + items.length + ' · ' + mins + ' मिनिटं</span>' +
        '</div>' +
        '<p class="px-3 pb-2 text-xs text-white/70">' + L.desc + '</p>' +
        rows(items) + '</section>';
    }).join('');
    $('sheet-body').innerHTML = html || '<p class="p-8 text-center text-sm text-white/70">काहीच सापडलं नाही.</p>';
  }

  const btns = $('sheet-body').querySelectorAll('[data-song]');
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      const s = SONGS[Number(b.dataset.song)];
      const visible = Array.prototype.map.call(btns, function (x) {
        return SONGS[Number(x.dataset.song)];
      });
      if (queue[at] === s && yt) { playing ? yt.pauseVideo() : yt.playVideo(); }
      else play(s, visible);
    });
  });
}

function openSheet(which) {
  mode = which;
  lastFocus = document.activeElement;
  $('sheet').hidden = false;
  render();
  nextFrame(function () { $('sheet-panel').dataset.open = 'true'; });
  $('search').focus();
}

function closeSheet() {
  $('sheet-panel').dataset.open = 'false';
  setTimeout(function () { $('sheet').hidden = true; }, 350);
  if (lastFocus) lastFocus.focus();
}

document.querySelectorAll('[data-sheet]').forEach(function (b) {
  b.addEventListener('click', function () { openSheet(b.dataset.sheet); });
});

/* Boot.
 *
 * Everything above is wired before this runs, so the buttons work the moment
 * the songs arrive. If the list cannot be fetched the page still stands: the
 * artwork is the site, and the bar says plainly that the songs are missing
 * rather than sitting there pretending. */
fetch('songs.json', { cache: 'no-cache' })
  .then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  })
  .then(function (list) {
    if (!Array.isArray(list) || !list.length) throw new Error('empty');
    SONGS = list;
    restore();
    render();
  })
  .catch(function () {
    $('p-title').textContent = 'गाण्यांची यादी मिळाली नाही';
    $('p-sub').textContent = 'नेटवर्क तपासा आणि पान पुन्हा उघडा';
  });
$('sheet-close').addEventListener('click', closeSheet);
$('sheet-scrim').addEventListener('click', closeSheet);
$('search').addEventListener('input', function (e) { query = e.target.value; render(); });

document.addEventListener('keydown', function (e) {
  if ($('sheet').hidden) return;
  if (e.key === 'Escape') { closeSheet(); return; }
  /* Keep focus inside the dialog while it is open. */
  if (e.key === 'Tab') {
    const f = $('sheet-panel').querySelectorAll('button, input, [href]');
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ============================================================
   Cards and install
   ============================================================ */

/* The floating panels rise in once the page has drawn them closed, so the
   class change reads as a transition rather than as their initial style. */
nextFrame(function () {
  document.querySelectorAll('.t-toast').forEach(function (el) {
    el.classList.add('is-open');
  });
});
document.querySelectorAll('[data-close-card]').forEach(function (b) {
  b.addEventListener('click', function () { $(b.dataset.closeCard).remove(); });
});

/* Chrome only offers an install prompt to a page with a service worker that
   handles fetch, so registration is what makes the button below possible at
   all. Deliberately after load: the worker warms a cache with the artwork, and
   that should never compete with the first paint. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {
      /* No worker means no install prompt and no offline copy, which is a
         smaller site rather than a broken one. Nothing to tell the visitor. */
    });
  });
}

let installEvent = null;
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  installEvent = e;
  $('btn-install').hidden = false;
});
window.addEventListener('appinstalled', function () {
  installEvent = null;
  $('btn-install').hidden = true;
});

$('btn-install').addEventListener('click', function () {
  if (!installEvent) return;
  installEvent.prompt();
  installEvent.userChoice.then(function () {
    installEvent = null;
    $('btn-install').hidden = true;
  });
});
</script>
</body>
</html>
