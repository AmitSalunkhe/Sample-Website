      clay: '#af7b50', 'clay-deep': '#6d452a', 'clay-dark': '#3d2517',

<style>
  :root { --pad: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; }
  body { line-height: 1.6; overflow: hidden; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 6px; }

  /*
   * Art direction.
   *
   * The title is painted into the artwork, so it must never be cropped.
   * Measured against the real file: object-fit:cover cuts it on anything
   * narrower than 16:9, a laptop included. So the image is sized by WIDTH and
   * pinned to the top, and the page carries on below it in the artwork's own
   * bottom colour. On ultrawide the overflow falls off the bottom, where there
   * is only floor.
   */
  .art {
    position: fixed; inset: 0;
    background-color: #af7b50;
    background-repeat: no-repeat;
    background-position: top center;
    background-size: 100% auto;
  }

  /*
   * One file per screen size, in the best format the browser takes.
   *
   * image-set picks AVIF where it is supported and falls back to WebP, and the
   * media queries pick the width. The breakpoints allow for portrait scaling
   * the art to 188%, so a 420px phone asks for 790px of image and is given the
   * 800px file rather than the 1672px one: 75 KB instead of 239 KB.
   */
  .art { background-image: image-set(
    url('img/hero-800.avif') type('image/avif'),
    url('img/hero-800.webp') type('image/webp')); }

  @media (min-width: 421px) {
    .art { background-image: image-set(
      url('img/hero-1200.avif') type('image/avif'),
      url('img/hero-1200.webp') type('image/webp')); }
  }
  @media (min-width: 701px) {
    .art { background-image: image-set(
      url('img/hero-1672.avif') type('image/avif'),
      url('img/hero-1672.webp') type('image/webp')); }
  }

  /* Safari shipped image-set behind a prefix for years; without this it gets
     no background at all rather than a smaller one. */
  @supports not (background-image: image-set(url('x.webp') type('image/webp'))) {
    .art { background-image: url('img/hero-1672.webp'); }
  }
  /* Fills the space under the art on tall screens, and darkens the floor so the
     glass panels have something solid to sit against. */
  .art::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      transparent 0%, transparent 58%,
      rgba(109,69,42,.34) 78%, rgba(61,37,23,.82) 100%);
  }

  .glass {
    background: rgba(38, 23, 14, .74);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid rgba(255, 233, 209, .16);
  }

  /* Scrubber: thin track, 22px hit area. */
  .scrub { -webkit-appearance: none; appearance: none; height: 24px; background: transparent; width: 100%; }
  .scrub::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; background: rgba(255,233,209,.25); }
  .scrub::-moz-range-track { height: 4px; border-radius: 999px; background: rgba(255,233,209,.25); }
  .scrub::-webkit-slider-thumb {
    -webkit-appearance: none; margin-top: -5px; height: 14px; width: 14px;
    border-radius: 50%; background: #FF9933; border: 2px solid #2a1a10; cursor: pointer;
  }
  .scrub::-moz-range-thumb {
    height: 14px; width: 14px; border-radius: 50%;
    background: #FF9933; border: 2px solid #2a1a10; cursor: pointer;
  }

  .sheet { transition: transform .3s cubic-bezier(.16,1,.3,1), opacity .3s; }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }

  /*
   * Portrait.
   *
   * The painted title spans the middle 52% of the artwork's width. Scaling the
   * image to 188% of the viewport leaves 53% of it visible, which is the widest
   * the art can go before the title starts losing its edges. That makes the
   * band 105.8vw tall (188 / 1.777), and everything below it is placed against
   * that number rather than guessed at.
   */
  @media (max-aspect-ratio: 13/10) {
    :root { --band: 105.8vw; }
    .art { background-size: 188% auto; }
    .art::after {
      background: linear-gradient(to bottom,
        transparent 0%, transparent calc(var(--band) - 5rem),
        rgba(109,69,42,.45) var(--band), rgba(61,37,23,.9) 100%);
    }
    /* Clear of the painted title, and sitting on the artwork's own dark floor.
       z-index 25 keeps it above the bottom stack, which would otherwise paint
       over it: the two are only about 40px apart on a short phone. */
    #topnav {
      top: calc(var(--band) - 2.9rem); right: 0; left: 0;
      z-index: 25; justify-content: center;
    }
    /* Never let the list push the player off a short screen. */
    #quick {
      display: block;
      max-height: calc(100dvh - var(--band) - 14rem);
      overflow-y: auto;
    }
  }
  @media (min-aspect-ratio: 13/10) { #quick { display: none; } }

  .no-scrollbar::-webkit-scrollbar { width: 6px; }
  .no-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,233,209,.25); border-radius: 999px; }
</style>

function tickClock() {
  $('clock').textContent = new Date()
    .toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit', hour12:true })
    .toUpperCase();
}
tickClock();
setInterval(tickClock, 20000);

/* ============================================================
   Player, on YouTube's IFrame API
   ============================================================
   The site stores no audio. Each track points at an upload its channel
   published, played behind our own controls. The API script is fetched only
   when someone actually presses play.
   ------------------------------------------------------------ */
let yt = null, apiPromise = null;
let queue = [], at = -1, playing = false, poll = null;

function loadApi() {
  if (apiPromise) return apiPromise;
  apiPromise = new Promise(function (resolve, reject) {
    if (window.YT && window.YT.Player) return resolve();
    window.onYouTubeIframeAPIReady = resolve;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.async = true;
    s.onerror = function () { reject(new Error('IFrame API did not load')); };
    document.head.appendChild(s);
    setTimeout(function () { reject(new Error('IFrame API timed out')); }, 12000);
  });
  apiPromise.catch(function () { apiPromise = null; });
  return apiPromise;
}

function play(song, list) {
  queue = (list && list.length) ? list : [song];
  at = queue.indexOf(song);

  $('p-title').textContent = song.t;
  $('p-sub').textContent = credit(song);
  $('p-dur').textContent = fmt(song.sec);
  $('p-seek').max = song.sec;
  $('p-seek').value = 0;
  $('p-now').textContent = '0:00';
  render();

  loadApi().then(function () {
    if (yt) { yt.loadVideoById(song.id); return; }
    yt = new YT.Player('yt-host', {
      videoId: song.id,
      playerVars: { autoplay: 1, playsinline: 1 },
      events: {
        onReady: function (e) { e.target.playVideo(); },
        onStateChange: function (e) {
          setPlaying(e.data === 1);
          if (e.data === 0) step(1);
        },
        /* A channel can pull or unlist an upload at any time. Say so rather
           than leaving a dead bar sitting there. */
        onError: function () {
          $('p-sub').textContent = 'हे सध्या वाजवता येत नाही';
          setPlaying(false);
        },
      },
    });
  }).catch(function () {
    $('p-sub').textContent = 'YouTube ला जोडता आलं नाही';
    setPlaying(false);
  });
}

function setPlaying(on) {
  playing = on;
  $('ic-play').classList.toggle('hidden', on);
  $('ic-pause').classList.toggle('hidden', !on);
  $('p-toggle').setAttribute('aria-label', on ? 'थांबव' : 'वाजव');
  clearInterval(poll);
  if (on) poll = setInterval(paint, 500);
  render();
}

function paint() {
  if (!yt || !yt.getCurrentTime) return;
  const pos = yt.getCurrentTime();
  /* Duration is re-read every tick rather than once: after loadVideoById
     YouTube reports PLAYING before the new metadata lands, so a single read
     leaves the scrubber scaled to the previous track. */
  const dur = yt.getDuration();
  if (dur > 0) { $('p-seek').max = Math.floor(dur); $('p-dur').textContent = fmt(dur); }
  $('p-seek').value = Math.floor(pos);
  $('p-now').textContent = fmt(pos);
}

function step(by) {
  const to = at + by;
  if (to < 0 || to >= queue.length) { if (yt) yt.pauseVideo(); return; }
  play(queue[to], queue);
}

$('p-toggle').addEventListener('click', function () {
  if (!yt) { play(SONGS[0], SONGS); return; }
  playing ? yt.pauseVideo() : yt.playVideo();
});
$('p-next').addEventListener('click', function () { step(1); });
$('p-prev').addEventListener('click', function () { step(-1); });
$('p-seek').addEventListener('input', function (e) {
  const v = Number(e.target.value);
  $('p-now').textContent = fmt(v);
  if (yt && yt.seekTo) yt.seekTo(v, true);
});

/* ============================================================
   Sheet
   ============================================================ */
let mode = 'songs', query = '', lastFocus = null;

function rows(list) {
  if (!list.length) return '<p class="p-8 text-center text-sm text-white/70">काहीच सापडलं नाही.</p>';
  return list.map(function (s) {
    const on = at >= 0 && queue[at] === s;
    const icon = (on && playing)
      ? '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'
      : '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    return '<button data-song="' + SONGS.indexOf(s) + '"' +
      ' class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left transition hover:bg-white/10 ' + (on ? 'bg-white/10' : '') + '">' +
      '<span class="grid h-9 w-9 shrink-0 place-items-center rounded-full ' + (on ? 'bg-saffron text-[#2a1a10]' : 'bg-white/15 text-white') + '">' + icon + '</span>' +
      '<span class="min-w-0 flex-1">' +
        '<span class="block truncate text-sm">' + s.t + (isLong(s) ? ' <span class="text-[10px] text-white/70">पूर्ण सत्र</span>' : '') + '</span>' +
        '<span class="block truncate text-xs text-white/70">' + credit(s) + '</span>' +
      '</span>' +
      '<span class="shrink-0 text-xs tabular-nums text-white/70">' + fmt(s.sec) + '</span>' +
    '</button>';
  }).join('');
}

function render() {
  renderQuick();
  if ($('sheet').hidden) return;
  const q = query.trim().toLowerCase();
  /* Search the same words the row actually shows. The credit line renders a
     raga as "राग पहाडी", so searching "राग" has to match; matching only the
     bare raga name meant the one word on screen found nothing. */
  const hit = function (s) {
    if (!q) return true;
    const hay = [s.t, s.by, s.poet, s.raga, s.raga ? 'राग ' + s.raga : '',
                 CATS[s.cat]].filter(Boolean).join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  };

  if (mode === 'songs') {
    $('sheet-title').textContent = 'गाणी';
    $('sheet-body').innerHTML = rows(SONGS.filter(hit));
  } else {
    $('sheet-title').textContent = 'याद्या';
    const html = LISTS.map(function (L) {
      const items = SONGS.filter(L.match).filter(hit);
      if (!items.length) return '';
      const mins = Math.round(items.reduce(function (a, s) { return a + s.sec; }, 0) / 60);
      return '<section class="mb-5">' +
        '<div class="flex items-baseline gap-2 px-3 pb-0.5">' +
          '<h3 class="text-sm font-semibold">' + L.name + '</h3>' +
          '<span class="text-xs text-white/70">' + items.length + ' · ' + mins + ' मिनिटं</span>' +
        '</div>' +
        '<p class="px-3 pb-2 text-xs text-white/70">' + L.desc + '</p>' +
        rows(items) + '</section>';
    }).join('');
    $('sheet-body').innerHTML = html || '<p class="p-8 text-center text-sm text-white/70">काहीच सापडलं नाही.</p>';
  }

  const btns = $('sheet-body').querySelectorAll('[data-song]');
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      const s = SONGS[Number(b.dataset.song)];
      const visible = Array.prototype.map.call(btns, function (x) {
        return SONGS[Number(x.dataset.song)];
      });
      if (queue[at] === s && yt) { playing ? yt.pauseVideo() : yt.playVideo(); }
      else play(s, visible);
    });
  });
}

/* The quick list shares the sheet's row markup, so a track looks and behaves
   the same in both places. */
function renderQuick() {
  const body = $('quick-body');
  if (!body) return;
  /* One per category, in order. SONGS opens with eight readings of the same
     abhang, so slicing the first four would offer the same song four times. */
  const seen = {};
  const picks = SONGS.filter(function (s) {
    if (seen[s.cat]) return false;
    seen[s.cat] = 1;
    return true;
  }).slice(0, 5);
  body.innerHTML = rows(picks);
  body.querySelectorAll('[data-song]').forEach(function (b) {
    b.addEventListener('click', function () {
      const song = SONGS[Number(b.dataset.song)];
      if (queue[at] === song && yt) { playing ? yt.pauseVideo() : yt.playVideo(); }
      else play(song, picks);
    });
  });
}

function openSheet(which) {
  mode = which;
  lastFocus = document.activeElement;
  $('sheet').hidden = false;
  render();
  requestAnimationFrame(function () {
    $('sheet-panel').classList.remove('translate-y-4', 'opacity-0');
  });
  $('search').focus();
}

function closeSheet() {
  $('sheet-panel').classList.add('translate-y-4', 'opacity-0');
  setTimeout(function () { $('sheet').hidden = true; }, 200);
  if (lastFocus) lastFocus.focus();
}

renderQuick();

document.querySelectorAll('[data-sheet]').forEach(function (b) {
  b.addEventListener('click', function () { openSheet(b.dataset.sheet); });
});
$('sheet-close').addEventListener('click', closeSheet);
$('sheet-scrim').addEventListener('click', closeSheet);
$('search').addEventListener('input', function (e) { query = e.target.value; render(); });

document.addEventListener('keydown', function (e) {
  if ($('sheet').hidden) return;
  if (e.key === 'Escape') { closeSheet(); return; }
  /* Keep focus inside the dialog while it is open. */
  if (e.key === 'Tab') {
    const f = $('sheet-panel').querySelectorAll('button, input, [href]');
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ============================================================
   Cards and install
   ============================================================ */
document.querySelectorAll('[data-close-card]').forEach(function (b) {
  b.addEventListener('click', function () { $(b.dataset.closeCard).remove(); });
});

let installEvent = null;
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  installEvent = e;
  $('btn-install').hidden = false;
});
$('btn-install').addEventListener('click', function () {
  if (!installEvent) return;
  installEvent.prompt();
  installEvent.userChoice.then(function () {
    installEvent = null;
    $('btn-install').hidden = true;
  });
});
</script>
</body>
</html>
